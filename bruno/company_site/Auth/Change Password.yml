info:
  name: Change Password
  type: http
  seq: 6

http:
  method: PUT
  url: "{{base_url}}/api/admin/auth/change-password"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{accessToken}}
  body:
    type: json
    data: |-
      {
          "current_password": "YourPassword123!",
          "password": "Admin123@",
          "password_confirmation": "Admin123@"
      }
  auth: inherit

runtime:
  variables:
    - name: base_url
      value: http://127.0.0.1:8080

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
