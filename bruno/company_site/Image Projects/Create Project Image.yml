info:
  name: Create Project Image
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/api/admin/projects/2/images"
  headers:
    - name: Accept
      value: application/json
    - name: Authorization
      value: Bearer {{accessToken}}
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "image": "projects/corporate-website/gallery/image-1.jpg",
        "display_order": 1
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
