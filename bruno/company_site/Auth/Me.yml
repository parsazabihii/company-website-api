info:
  name: Me
  type: http
  seq: 4

http:
  method: GET
  url: "{{base_url}}/api/admin/auth/me"
  headers:
    - name: Accept
      value: application/json
    - name: Authorization
      value: Bearer {{accessToken}}
  auth: inherit

runtime:
  variables:
    - name: base_url
      value: http://127.0.0.1:8080

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
