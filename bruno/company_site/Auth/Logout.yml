info:
  name: Logout
  type: http
  seq: 7

http:
  method: POST
  url: "{{base_url}}/api/admin/auth/logout"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{accessToken}}
  body:
    type: json
    data: |-
      {
          "refresh_token": "{{refreshToken}}"
      }
  auth: inherit

runtime:
  variables:
    - name: base_url
      value: http://127.0.0.1:8080

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
