info:
  name: Update Profile
  type: http
  seq: 5

http:
  method: PATCH
  url: "{{base_url}}/api/admin/auth/profile"
  headers:
    - name: Accept
      value: application/json
    - name: Authorization
      value: Bearer {{accessToken}}
  params:
    - name: ""
      value: ""
      type: query
  body:
    type: multipart-form
    data:
      - name: first_name
        type: text
        value: Text
        contentType: Updated Admin
      - name: last_name
        type: text
        value: Text
        contentType: User
      - name: avatar
        type: file
        value:
          - C:\Users\ASUS\Pictures\5qldoa.jpg
        contentType: image/jpeg
  auth: inherit

runtime:
  variables:
    - name: base_url
      value: http://127.0.0.1:8080

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
