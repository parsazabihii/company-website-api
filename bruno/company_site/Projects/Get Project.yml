info:
  name: Get Project
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/api/admin/projects"
  headers:
    - name: Accept
      value: application/json
    - name: Authorization
      value: Bearer {{accessToken}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
