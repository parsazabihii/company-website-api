info:
  name: Update Project Image
  type: http
  seq: 3

http:
  method: PATCH
  url: "{{base_url}}/api/admin/projects/2/images/1"
  headers:
    - name: Accept
      value: application/json
    - name: Authorization
      value: Bearer {{accessToken}}
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "image": "projects/corporate-website/gallery/updated-image.jpg",
        "display_order": 2
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
